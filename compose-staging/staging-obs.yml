# Sprint 12 Pha 3 — csr-obs (192.168.40.53): Loki + Grafana + Prometheus
# Adapted from R20: IP 10.10.1.13 -> default, ZFS -> /data/csr

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: csr-loki-staging
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    user: "0"
    volumes:
      - /data/csr/loki:/loki
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: csr-prometheus-staging
    restart: unless-stopped
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - /data/csr/prometheus:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.0.0
    container_name: csr-grafana-staging
    restart: unless-stopped
    user: "0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - /data/csr/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
