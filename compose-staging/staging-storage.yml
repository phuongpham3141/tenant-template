# Sprint 12 Pha 3 — csr-storage (192.168.40.52): MinIO + Meilisearch
# Adapted from R20: IP 10.10.1.12 -> default, ZFS -> /data/csr
# + minio-init (bucket creation, dev pattern)

services:
  minio:
    image: minio/minio:latest
    container_name: csr-minio-staging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /data/csr/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: csr-minio-init-staging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/medusa-media &&
      mc mb -p local/payload-uploads &&
      mc anonymous set download local/medusa-media &&
      echo 'buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: csr-meilisearch-staging
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - /data/csr/meilisearch:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
