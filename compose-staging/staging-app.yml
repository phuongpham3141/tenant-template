# Sprint 12 Pha 3 — csr-app (192.168.40.50): Medusa + Storefront + Payload
# Adapted from R20 compose-staging-app.yml:
# - ghcr.io images (chua ton tai) -> build local tu Dockerfile
# - D43 deviation: target DEVELOPMENT (production target co pre-existing TS errors
#   trong workers; dev target la proven path tren medusa-dev. Sprint 13 fix TS -> production target)
# - IP 10.10.1.x -> 192.168.40.x
# - TENANT cybersilkroads -> csr (canonical L18)
# - CORS qua IP truc tiep (DNS staging deferred Pha 4)

services:
  medusa:
    build:
      context: ../medusa
      dockerfile: Dockerfile
      target: development
    container_name: csr-medusa-staging
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MEDUSA_WORKER_MODE: shared
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@192.168.40.51:5432/${POSTGRES_DB_MEDUSA}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@192.168.40.51:6379
      JWT_SECRET: ${MEDUSA_JWT_SECRET}
      COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET}
      STORE_CORS: http://192.168.40.50:3000
      ADMIN_CORS: http://192.168.40.50:9000,http://192.168.40.50:7001
      AUTH_CORS: http://192.168.40.50:3000,http://192.168.40.50:9000,http://192.168.40.50:7001
      S3_FILE_URL: http://192.168.40.52:9000/medusa-media
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_BUCKET: medusa-media
      S3_ENDPOINT: http://192.168.40.52:9000
      DEFAULT_TENANT_ID: csr
      SYSTEM_TENANT_ID: csr
    ports:
      - "9000:9000"
      - "7001:7001"
    command: sh -c "npx medusa db:migrate || true; npm run dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  storefront:
    build:
      context: ../storefront
      dockerfile: Dockerfile
      target: development
    container_name: csr-storefront-staging
    restart: unless-stopped
    depends_on:
      - medusa
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://192.168.40.50:9000
      NEXT_PUBLIC_BASE_URL: http://192.168.40.50:3000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_TENANT: csr
    ports:
      - "3000:3001"

  payload:
    build:
      context: ../payload
      dockerfile: Dockerfile
      target: development
    container_name: csr-payload-staging
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@192.168.40.51:5432/${POSTGRES_DB_PAYLOAD}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: http://192.168.40.50:3001
    ports:
      - "3001:3000"
