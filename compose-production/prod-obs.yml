# Sprint 13 P0-1B — csr-obs-prod (192.168.40.63): Loki + Grafana + Prometheus

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: csr-loki-prod
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    user: "0"
    volumes:
      - /data/csr/loki:/loki
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: csr-prometheus-prod
    restart: unless-stopped
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - /data/csr/prometheus:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.0.0
    container_name: csr-grafana-prod
    restart: unless-stopped
    user: "0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - /data/csr/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
